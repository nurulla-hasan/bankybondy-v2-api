services:
  # ── MongoDB (Single-Node Replica Set for transactions, internal only) ──
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Init (create default bucket & public read policy) ──
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/banky-bondy;
      mc anonymous set download local/banky-bondy;
      exit 0;
      "

  # ── Redis (for BullMQ + rate limiting) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Backend API (Express) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - MATCH_CANDIDATE_MODE=knn
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs

  # ── Backend Worker (BullMQ matching) ──
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - MATCH_CANDIDATE_MODE=knn
    command: ["node", "dist/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Frontend (Next.js) ──
  # NEXT_PUBLIC_* values are baked into the bundle at build time.
  # Set PUBLIC_URL in ./.env (e.g. http://72.61.115.32) before building.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${PUBLIC_URL:-http://localhost}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-}
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL:-http://localhost}/api/v1
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_URL:-http://localhost}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        BACKEND_API_URL: http://backend:5000
    restart: unless-stopped
    env_file: ./frontend/.env.local
    environment:
      - BACKEND_API_URL=http://backend:5000
      - NEXT_PUBLIC_APP_URL=${PUBLIC_URL:-http://localhost}
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-}
      - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_URL:-http://localhost}/api/v1
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
      - BING_SITE_VERIFICATION=${BING_SITE_VERIFICATION:-}
    depends_on:
      - backend

  # ── Nginx (reverse proxy) ──
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  redis_data:
  backend_logs:
  mongo_data:
  minio_data:
