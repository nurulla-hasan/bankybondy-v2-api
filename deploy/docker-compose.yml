services:
  # ── MongoDB (Single-Node Replica Set for transactions, internal only) ──
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (for BullMQ + rate limiting) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Backend API (Express) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - MATCH_CANDIDATE_MODE=knn
      - STORAGE_DRIVER=local
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - ./uploads:/app/uploads

  # ── Backend Worker (BullMQ matching) ──
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - MATCH_CANDIDATE_MODE=knn
      - STORAGE_DRIVER=local
    command: ["node", "dist/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - ./uploads:/app/uploads

  # ── Frontend (Next.js) ──
  # NEXT_PUBLIC_* values are baked into the bundle at build time.
  # Set PUBLIC_URL in ./.env (e.g. http://72.61.115.32) before building.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${PUBLIC_URL:-http://localhost}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-}
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL:-http://localhost}/api/v1
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_URL:-http://localhost}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        BACKEND_API_URL: http://backend:5000
    restart: unless-stopped
    env_file: ./frontend/.env.local
    environment:
      - BACKEND_API_URL=http://backend:5000
      - NEXT_PUBLIC_APP_URL=${PUBLIC_URL:-http://localhost}
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-}
      - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_URL:-http://localhost}/api/v1
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
      - BING_SITE_VERIFICATION=${BING_SITE_VERIFICATION:-}
    depends_on:
      - backend

  # ── Admin Dashboard (Next.js) ──
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${PUBLIC_URL:-http://localhost}:3001
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL:-http://localhost}/api/v1
        BACKEND_API_URL: http://backend:5000
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - BACKEND_API_URL=http://backend:5000
      - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_URL:-http://localhost}/api/v1
    depends_on:
      - backend

  # ── Nginx (reverse proxy) ──
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend

volumes:
  redis_data:
  backend_logs:
  mongo_data:
